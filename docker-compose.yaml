version: '3.8'

services:
  app:
    image: douyin-live-recorder:local
    build: .
    environment:
      - TERM=xterm-256color
    tty: true
    stdin_open: true
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./backup_config:/app/backup_config
      - ./downloads:/app/downloads
      - /root/.config/rclone:/root/.config/rclone
    restart: always
