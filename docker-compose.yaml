version: '3.8'

services:
  app:
    image: douyin-live-recorder:local
    build: .
    environment:
      - TERM=xterm-256color
    tty: true
    stdin_open: true
    volumes:
      - ./docker_data/config:/app/config
      - ./docker_data/logs:/app/logs
      - ./docker_data/backup_config:/app/backup_config
      - ./docker_data/downloads:/app/downloads
    restart: always
